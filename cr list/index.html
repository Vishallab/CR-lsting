<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CR Deployment Management Portal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <div
        id="loginPage"
        class="login-container"
    >

        <div class="login-card">


            <!-- LOGO -->

            <div class="logo">
                CR
            </div>


            <!-- TITLE -->

            <h1>
                CR Deployment Portal
            </h1>


            <p class="login-subtitle">
                Centralized CR Management & Deployment System
            </p>


            <!-- USERNAME -->

            <div class="login-form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="login-form-group">

                <label for="loginPassword">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        title="Show/Hide Password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN ERROR -->

            <div
                id="loginError"
                class="login-error hidden"
            >
                Invalid username or password.
            </div>


            <!-- LOGIN BUTTON -->

            <button
                class="primary-btn login-btn"
                onclick="login()"
            >
                Login
            </button>


            <!-- LOGIN INFO -->

            <div class="login-info">

                <span>
                    CR Deployment Management System
                </span>

            </div>


        </div>

    </div>



    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <div
        id="appPage"
        class="app hidden"
    >


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">


            <!-- SIDEBAR LOGO -->

            <div class="sidebar-logo">

                <div class="logo small-logo">
                    CR
                </div>


                <div>

                    <strong>
                        CR Portal
                    </strong>

                    <span>
                        Deployment System
                    </span>

                </div>

            </div>



            <!-- LOGGED-IN USER -->

            <div class="user-box">


                <div
                    class="avatar"
                    id="userAvatar"
                >
                    V
                </div>


                <div>

                    <strong id="loggedUserName">
                        Vishal
                    </strong>

                    <span id="loggedUserRole">
                        Developer
                    </span>

                </div>


            </div>



            <!-- SIDEBAR MENU -->

            <nav id="sidebarMenu">

                <!-- Menu generated by JavaScript -->

            </nav>



            <!-- LOGOUT -->

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>


        </aside>



        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">


                <div>

                    <h2 id="pageTitle">
                        Dashboard
                    </h2>


                    <p id="pageSubtitle">
                        Welcome to CR Deployment Portal
                    </p>

                </div>



                <!-- TOP RIGHT -->

                <div class="topbar-right">


                    <!-- NOTIFICATION -->

                    <div
                        class="notification-icon"
                        onclick="showPage('notifications')"
                    >

                        🔔

                        <span id="notificationCount">
                            0
                        </span>

                    </div>



                    <!-- DATE -->

                    <div class="date-display">
                        02 Nov 2026
                    </div>


                </div>


            </header>



            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <section id="pageContent">

                <!-- Dynamic content generated by app.js -->

            </section>


        </main>


    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>


</body>

</html>
